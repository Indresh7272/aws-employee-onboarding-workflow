<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Onboarding</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Smart Employee Onboarding</h1>
    </header>

    <main>

        <section class="welcome">
            <h2>Welcome, Employee!</h2>
            <p>Complete the following steps before your joining date.</p>
        </section>


        <section class="progress-section">

            <h2>Onboarding Progress</h2>

            <div class="progress-container">
                <div class="progress-bar">
                    25%
                </div>
            </div>

        </section>


        <section class="status-section">

            <h2>Onboarding Stages</h2>

            <div class="status-card">
                <span>Document Collection</span>
                <span class="status complete">Complete</span>
            </div>

            <div class="status-card">
                <span>IT Provisioning</span>
                <span class="status in-progress">In Progress</span>
            </div>

            <div class="status-card">
                <span>Policy Sign-off</span>
                <span class="status pending">Pending</span>
            </div>

            <div class="status-card">
                <span>Manager Introduction</span>
                <span class="status pending">Pending</span>
            </div>

        </section>


        <section class="documents">

            <h2>Document Collection</h2>

            <div class="document-item">

                <label>ID Proof</label>

                <input type="file">

                <button class="upload-btn">Upload</button>

            </div>


            <div class="document-item">

                <label>Degree Certificate</label>

                <input type="file">

                <button class="upload-btn">Upload</button>

            </div>


            <div class="document-item">

                <label>Signed Offer Letter</label>

                <input type="file">

                <button class="upload-btn">Upload</button>

            </div>

        </section>

    </main>
      <script src="js/api.js"></script>
      <script src="js/employee.js"></script>
</body>

</html>
